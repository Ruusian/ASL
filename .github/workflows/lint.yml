name: ShellCheck Linting

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
    
    - name: Run ShellCheck on shell scripts
      run: |
        echo "Linting all shell scripts in the repository..."
        find . -type f \( -name "*.sh" -o -path "*/bin/*" \) ! -path "./.git/*" ! -path "./.venv/*" -print0 | \
        xargs -0 -r shellcheck --severity=warning
    
    - name: Verify syntax of all shell scripts
      run: |
        # shopt -s nullglob so a directory with no .sh files yields an empty
        # list instead of the literal glob (which made `bash -n` exit 127).
        shopt -s nullglob
        count=0
        for script in bin/asl $(find . -type f -name '*.sh' ! -path './.git/*' ! -path './.venv/*' | sort); do
          echo "Syntax check: $script"
          bash -n "$script"
          count=$((count + 1))
        done
        echo "Checked $count shell scripts."
        if [ "$count" -eq 0 ]; then
          echo "ERROR: no shell scripts found to check!"
          exit 1
        fi

  markdown-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Lint Markdown files
      # Replaces nostalgia-squirrel/markdown-linter, whose repository has been
      # deleted (GitHub returns 404), which failed this job at "Set up job"
      # before any linting could run. Rules are configured in
      # .markdownlint-cli2.jsonc.
      uses: DavidAnson/markdownlint-cli2-action@v24
      with:
        globs: |
          "**/*.md"
          "!node_modules"

  readme-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check README exists
      run: |
        if [ ! -f README.md ]; then
          echo "ERROR: README.md not found!"
          exit 1
        fi
        echo "README.md found"
    
    - name: Check CHANGELOG exists
      run: |
        if [ ! -f CHANGELOG.md ]; then
          echo "ERROR: CHANGELOG.md not found!"
          exit 1
        fi
        echo "CHANGELOG.md found"
